---
name: semantic-release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dryrun"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write    # allow to create tag / push commit
  pull-requests: read
  issues: write

jobs:
  release:
    if: github.repository == 'marslo/cr-manager'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # semantic-release required full history
          persist-credentials: false       # do not use the default GITHUB_TOKEN for git operations

      - name: Setup git user
        run: |
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@martynus.net"

      - name: Configure git auth to use PAT
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: |
          python3 -m pip install --user poetry
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"

      - name: Install pre-commit
        run: python3 -m pip install --user pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # semantic-release >= 26 requires node >= 26.13; on an older node npm silently falls back to semantic-release 25
          node-version: "26"
          package-manager-cache: false

      # majors pinned: semantic-release 26 renders notes with its bundled release-notes-generator 15 / conventional-changelog-writer 9
      # ( function templates, see .releaserc.js ); a standalone @semantic-release/release-notes-generator is not used
      - name: Install semantic-release globally
        run: |
          npm install -g \
            semantic-release@26 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/changelog@7 \
            @semantic-release/exec@7 \
            @semantic-release/git@11 \
            @semantic-release/github@12 \
            conventional-changelog-conventionalcommits@10
          semantic-release --version

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          CI: "true"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            semantic-release --dry-run
          else
            semantic-release
          fi
